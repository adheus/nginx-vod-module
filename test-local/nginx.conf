worker_processes 1;

error_log /var/log/nginx/error.log debug;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    access_log /var/log/nginx/access.log;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 60;

    # vod caches — response cache OFF so we exercise the filter pipeline on each request
    vod_metadata_cache metadata_cache 128m;
    vod_mapping_cache  mapping_cache  5m;

    # segment settings
    vod_segment_duration 4000;
    vod_align_segments_to_key_frames on;

    # allow CORS for testing
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Range" always;

    server {
        listen 8080;
        server_name localhost;

        # ---------------------------------------------------------------
        # Local mode: serve MP4 files directly from disk as HLS
        # Test: curl http://localhost:8080/local/hls/tone_440hz.mp4/index.m3u8
        # ---------------------------------------------------------------
        location /local/hls/ {
            alias /web/content/;
            vod hls;
            vod_mode local;

            expires 100d;
        }

        # ---------------------------------------------------------------
        # Mapped mode: mapping server returns JSON with filters
        # Request: /mapped/hls/<mapping_key>/index.m3u8
        # nginx calls: http://localhost:8888/<mapping_key>
        # ---------------------------------------------------------------
        location /mapped/hls/ {
            vod hls;
            vod_mode mapped;
            vod_upstream_location /mapping_proxy;

            vod_hls_mpegts_interleave_frames on;
            vod_manifest_segment_durations_mode accurate;

            expires 100d;
        }

        # Internal proxy to the mapping server
        location /mapping_proxy/ {
            internal;
            proxy_pass http://127.0.0.1:8888/;
            proxy_set_header Host $http_host;
        }
    }
}
