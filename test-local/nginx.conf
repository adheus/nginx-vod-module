worker_processes 1;

error_log /var/log/nginx/error.log debug;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    access_log /var/log/nginx/access.log;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 60;

    # vod caches — response cache OFF so we exercise the filter pipeline on each request
    vod_metadata_cache metadata_cache 128m;
    vod_mapping_cache  mapping_cache  5m;

    # segment settings
    vod_segment_duration 4000;
    vod_align_segments_to_key_frames on;

    # allow CORS for testing
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Range" always;

    server {
        listen 8080;
        server_name localhost;

        # ---------------------------------------------------------------
        # Test player page — hls.js-based A/B player
        # Browse: http://localhost:8080/test/
        # ---------------------------------------------------------------
        location /test/ {
            alias /web/test/;
            index test_player.html;
            autoindex on;
        }

        # ---------------------------------------------------------------
        # Local mode: serve MP4 files directly from disk as HLS
        # ---------------------------------------------------------------
        location /local/hls/ {
            alias /web/content/;
            vod hls;
            vod_mode local;

            # Test environment: prevent any caching so every build/listen
            # cycle fetches fresh content. Without this, browser caches can
            # silently invalidate A/B listening.
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
        }

        # ---------------------------------------------------------------
        # Mapped mode — state hook ENABLED
        # ---------------------------------------------------------------
        location /mapped/hls/ {
            vod hls;
            vod_mode mapped;
            vod_upstream_location /mapping_proxy;

            vod_hls_mpegts_interleave_frames on;
            vod_manifest_segment_durations_mode accurate;

            # Stateful audio hook: fetch prior-segment encoder state before
            # encoding and POST new state back after. Produces bit-exact
            # gapless audio across segment boundaries.
            vod_encoder_state_location /_state;
            vod_encoder_state_max_size 262144;  # Phase 28: N×12KB decoder blobs per seg
            # Blocking POST required: without it, seg-N+1's GET can race
            # ahead of seg-N's POST, causing a 404 fallback and priming at
            # that boundary. See FINDINGS §5 "seg-2 race" bug.
            vod_encoder_state_post_blocking on;
            # keep the cold-start GET so state_server.py's warmup-blob path stays reachable
            vod_encoder_state_cold_start_get on;

            # Test environment: prevent any caching so every build/listen
            # cycle fetches fresh content. Without this, browser caches can
            # silently invalidate A/B listening.
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
        }

        # ---------------------------------------------------------------
        # Mapped mode — state hook DISABLED (baseline for A/B comparison)
        # Same mappings, different URL prefix, no state hook.
        # ---------------------------------------------------------------
        location /nostate/hls/ {
            vod hls;
            vod_mode mapped;
            vod_upstream_location /mapping_proxy_nostate;

            vod_hls_mpegts_interleave_frames on;
            vod_manifest_segment_durations_mode accurate;

            # Test environment: prevent any caching so every build/listen
            # cycle fetches fresh content. Without this, browser caches can
            # silently invalidate A/B listening.
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
        }

        # ---------------------------------------------------------------
        # Phase 7: fMP4 HLS output — state hook ENABLED. Same mappings,
        # fMP4 container. Tests whether Phase 7's edts/elst emission in
        # init.mp4 lets the player skip AAC priming silence at seg-2.
        # ---------------------------------------------------------------
        location /fmp4/hls/ {
            vod hls;
            vod_mode mapped;
            vod_upstream_location /mapping_proxy;

            vod_hls_container_format fmp4;
            vod_manifest_segment_durations_mode accurate;

            vod_encoder_state_location /_state;
            vod_encoder_state_max_size 262144;  # Phase 28: N×12KB decoder blobs per seg
            vod_encoder_state_post_blocking on;
            # keep the cold-start GET so state_server.py's warmup-blob path stays reachable
            vod_encoder_state_cold_start_get on;

            # Test environment: prevent any caching so every build/listen
            # cycle fetches fresh content. Without this, browser caches can
            # silently invalidate A/B listening.
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
        }

        # Internal proxy to the mapping server
        location /mapping_proxy/ {
            internal;
            proxy_pass http://127.0.0.1:8888/;
            proxy_set_header Host $http_host;
        }

        # Same mapping server, different internal location so /nostate/ can
        # reuse the same test endpoints without state hook.
        location /mapping_proxy_nostate/ {
            internal;
            proxy_pass http://127.0.0.1:8888/;
            proxy_set_header Host $http_host;
        }

        # Internal proxy to the state-upstream server (port 8889)
        location /_state {
            internal;
            proxy_pass http://127.0.0.1:8889/state;
            proxy_set_header Host $http_host;
            client_max_body_size 256k;
            client_body_buffer_size 256k;
            proxy_buffering off;
        }
    }
}
