worker_processes 1;

error_log /var/log/nginx/error.log debug;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    access_log /var/log/nginx/access.log;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 60;

    # vod caches — response cache OFF so we exercise the filter pipeline on each request
    vod_metadata_cache metadata_cache 128m;
    vod_mapping_cache  mapping_cache  5m;

    # segment settings
    vod_segment_duration 4000;
    vod_align_segments_to_key_frames on;

    # allow CORS for testing
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Range" always;

    server {
        listen 8080;
        server_name localhost;

        # ---------------------------------------------------------------
        # Test player page — hls.js-based A/B player
        # Browse: http://localhost:8080/test/
        # ---------------------------------------------------------------
        location /test/ {
            alias /web/test/;
            index test_player.html;
            autoindex on;
        }

        # ---------------------------------------------------------------
        # Local mode: serve MP4 files directly from disk as HLS
        # ---------------------------------------------------------------
        location /local/hls/ {
            alias /web/content/;
            vod hls;
            vod_mode local;

            # Test environment: prevent any caching so every build/listen
            # cycle fetches fresh content. Without this, browser caches can
            # silently invalidate A/B listening.
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
        }

        # ---------------------------------------------------------------
        # Mapped mode — state hook ENABLED
        # ---------------------------------------------------------------
        location /mapped/hls/ {
            vod hls;
            vod_mode mapped;
            vod_upstream_location /mapping_proxy;

            vod_hls_mpegts_interleave_frames on;
            vod_manifest_segment_durations_mode accurate;

            # Stateful audio hook: fetch prior-segment encoder state before
            # encoding and POST new state back after. Produces bit-exact
            # gapless audio across segment boundaries.
            vod_encoder_state_location /_state;
            vod_encoder_state_max_size 262144;  # Phase 28: N×12KB decoder blobs per seg
            # Blocking POST required: without it, seg-N+1's GET can race
            # ahead of seg-N's POST, causing a 404 fallback and priming at
            # that boundary. See FINDINGS §5 "seg-2 race" bug.
            vod_encoder_state_post_blocking on;
            # keep the cold-start GET so state_server.py's warmup-blob path stays reachable
            vod_encoder_state_cold_start_get on;

            # Test environment: prevent any caching so every build/listen
            # cycle fetches fresh content. Without this, browser caches can
            # silently invalidate A/B listening.
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
        }

        # ---------------------------------------------------------------
        # Mapped mode — state hook DISABLED (baseline for A/B comparison)
        # Same mappings, different URL prefix, no state hook.
        # ---------------------------------------------------------------
        location /nostate/hls/ {
            vod hls;
            vod_mode mapped;
            vod_upstream_location /mapping_proxy_nostate;

            vod_hls_mpegts_interleave_frames on;
            vod_manifest_segment_durations_mode accurate;

            # Test environment: prevent any caching so every build/listen
            # cycle fetches fresh content. Without this, browser caches can
            # silently invalidate A/B listening.
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
        }

        # ---------------------------------------------------------------
        # Phase 7: fMP4 HLS output — state hook ENABLED. Same mappings,
        # fMP4 container. Tests whether Phase 7's edts/elst emission in
        # init.mp4 lets the player skip AAC priming silence at seg-2.
        # ---------------------------------------------------------------
        location /fmp4/hls/ {
            vod hls;
            vod_mode mapped;
            vod_upstream_location /mapping_proxy;

            vod_hls_container_format fmp4;
            vod_manifest_segment_durations_mode accurate;

            vod_encoder_state_location /_state;
            vod_encoder_state_max_size 262144;  # Phase 28: N×12KB decoder blobs per seg
            vod_encoder_state_post_blocking on;
            # keep the cold-start GET so state_server.py's warmup-blob path stays reachable
            vod_encoder_state_cold_start_get on;

            # Test environment: prevent any caching so every build/listen
            # cycle fetches fresh content. Without this, browser caches can
            # silently invalidate A/B listening.
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
        }

        # ---------------------------------------------------------------
        # Remote mode — sources fetched over HTTP from origin_server.py.
        # This is the ONLY location that exercises the HTTP reader, which
        # is the code path production uses and the one the concurrent-read
        # work targets. The local/mapped locations above use the FILE
        # reader, where concurrency is inactive by design — a change to
        # the read scheduler would pass those tests without running.
        # ---------------------------------------------------------------
        location /remote/hls/ {
            vod hls;
            vod_mode mapped;
            vod_upstream_location /mapping_proxy;
            vod_remote_upstream_location /origin_proxy;

            vod_hls_mpegts_interleave_frames on;
            vod_manifest_segment_durations_mode accurate;

            vod_encoder_state_location /_state;
            vod_encoder_state_max_size 262144;
            vod_encoder_state_post_blocking on;

            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
        }

        # Remote mode WITHOUT the state hook — isolates read-scheduler
        # behaviour from FFSA behaviour when bisecting a regression.
        location /remote-nostate/hls/ {
            vod hls;
            vod_mode mapped;
            vod_upstream_location /mapping_proxy_nostate;
            vod_remote_upstream_location /origin_proxy;

            vod_hls_mpegts_interleave_frames on;
            vod_manifest_segment_durations_mode accurate;

            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
        }

        # ---------------------------------------------------------------
        # Read-ahead fixtures — remote reader + unmuxed renditions, for the
        # r_sparse_video / r_sparse_muxed mappings. The 256k cache buffer
        # (explicit, = module default) makes a ~1.3MB video segment span ~5
        # chunks of ONE source, which is the case single-source read-ahead
        # exists for. /ra/ runs the default cap (read-ahead on); /ra-serial/
        # pins vod_max_concurrent_reads 1 (read-ahead off) so segment md5s
        # can be A/B'd. Both are nostate so the A/B is order-independent.
        # ---------------------------------------------------------------
        location /ra/hls/ {
            vod hls;
            vod_mode mapped;
            vod_upstream_location /mapping_proxy_nostate;
            vod_remote_upstream_location /origin_proxy;

            vod_cache_buffer_size 256k;
            vod_hls_force_unmuxed_segments on;
            vod_hls_mpegts_interleave_frames on;
            vod_manifest_segment_durations_mode accurate;

            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        }

        location /ra-serial/hls/ {
            vod hls;
            vod_mode mapped;
            vod_upstream_location /mapping_proxy_nostate;
            vod_remote_upstream_location /origin_proxy;

            vod_cache_buffer_size 256k;
            vod_max_concurrent_reads 1;
            vod_hls_force_unmuxed_segments on;
            vod_hls_mpegts_interleave_frames on;
            vod_manifest_segment_durations_mode accurate;

            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        }

        # Muxed twins of the two above (no forced unmuxing): a single request
        # runs the audio FILTER phase (6 stems) and then the video muxer phase,
        # which is the FILTER->PROCESS slot hand-off read-ahead relies on.
        location /ra-muxed/hls/ {
            vod hls;
            vod_mode mapped;
            vod_upstream_location /mapping_proxy_nostate;
            vod_remote_upstream_location /origin_proxy;

            vod_cache_buffer_size 256k;
            vod_hls_mpegts_interleave_frames on;
            vod_manifest_segment_durations_mode accurate;

            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        }

        location /ra-muxed-serial/hls/ {
            vod hls;
            vod_mode mapped;
            vod_upstream_location /mapping_proxy_nostate;
            vod_remote_upstream_location /origin_proxy;

            vod_cache_buffer_size 256k;
            vod_max_concurrent_reads 1;
            vod_hls_mpegts_interleave_frames on;
            vod_manifest_segment_durations_mode accurate;

            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        }

        # FILTER-phase read-ahead under the state hook: a 64k cache buffer makes
        # each stem need more than one chunk per segment, so read-ahead runs
        # inside the audio filter. Output must still match the /remote/hls/
        # reference md5s (same mappings, 256k buffer) byte for byte. The FFSA
        # key is an md5 of the URI prefix, so this location has its own chain.
        location /ra-state/hls/ {
            vod hls;
            vod_mode mapped;
            vod_upstream_location /mapping_proxy;
            vod_remote_upstream_location /origin_proxy;

            vod_cache_buffer_size 64k;
            vod_hls_mpegts_interleave_frames on;
            vod_manifest_segment_durations_mode accurate;

            vod_encoder_state_location /_state;
            vod_encoder_state_max_size 262144;
            vod_encoder_state_post_blocking on;

            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        }

        # ---------------------------------------------------------------
        # UNMUXED renditions — separate video and audio playlists.
        #
        # Muxed segments force one grid on both tracks. With a sparse GOP that
        # is unsatisfiable: align on => video ~10s vs audio 4s in the same
        # segment; align off => 2 of 3 segments carry no keyframe at all and
        # MSE cannot decode them. Split renditions remove the constraint —
        # each track segments on its own natural grid and the player syncs by
        # PTS. Video stays keyframe-aligned and immutable; audio stays small
        # and 4s, so a stem change re-fetches ~100KB instead of the video too.
        # ---------------------------------------------------------------
        location /unmuxed/hls/ {
            vod hls;
            vod_mode mapped;
            vod_upstream_location /mapping_proxy;

            vod_hls_force_unmuxed_segments on;
            vod_hls_mpegts_interleave_frames on;
            vod_manifest_segment_durations_mode accurate;

            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        }

        # Internal proxy to the mapping server
        location /mapping_proxy/ {
            internal;
            proxy_pass http://127.0.0.1:8888/;
            proxy_set_header Host $http_host;
        }

        # Same mapping server, different internal location so /nostate/ can
        # reuse the same test endpoints without state hook.
        location /mapping_proxy_nostate/ {
            internal;
            proxy_pass http://127.0.0.1:8888/;
            proxy_set_header Host $http_host;
        }

        # Internal proxy to the range-capable origin (port 8890).
        # Trailing slash strips the /origin_proxy prefix, so a mapping
        # path of /stems/vocals.m4a reaches the origin as /stems/vocals.m4a.
        location /origin_proxy/ {
            internal;
            proxy_pass http://127.0.0.1:8890/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            # proxy_buffering must stay ON: the module's child_request reads
            # the whole upstream response into its own buffer in one shot.
            proxy_buffering on;
        }

        # Internal proxy to the state-upstream server (port 8889)
        location /_state {
            internal;
            proxy_pass http://127.0.0.1:8889/state;
            proxy_set_header Host $http_host;
            client_max_body_size 256k;
            client_body_buffer_size 256k;
            proxy_buffering off;
        }
    }
}
